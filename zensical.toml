[project]
site_name = "千手氏歴史アーカイブ"
site_url = "https://senju-archive.github.io/"
site_description = "千手氏に関わる史料・人物・系統を、歴史の流れの中で読み解くデジタルアーカイブ"
docs_dir = "docs"
site_dir = "site"
# 公式サイトのホームへ戻るURL

extra_css = ["assets/css/extra.css"]
nav = [
  { "ホーム" = "index.md" },
  { "千手氏とは" = "senju/index.md" },
  { "並列年表" = "timeline/index.md" },
  { "系統" = "lineages/index.md" },
  { "人物" = "persons/index.md" },
  { "事件・合戦" = "events/index.md" },
  { "史料" = "sources/index.md" },
  { "史跡" = "sites/index.md" },
  { "タグから探す" = "tags/index.md" },
  { "初めての方へ" = "guides/reading-guide.md" },
  { "関連機関・調査リンク" = "links/index.md" },
  { "編纂方針" = "guides/editorial-policy.md" },
  { "このサイトについて" = "about/index.md" },
  { "お問い合わせ" = "contact.md" },
]

[project.extra]
homepage = "https://senju-archive.github.io/"

[project.theme]
custom_dir = "overrides"
features = ["navigation.sections", "navigation.path", "search.highlight"]
font = false

[project.theme.palette]
scheme = "default"
primary = "custom"
accent = "red"

# 標準呼称によるタグ分類。未知の表記を誤登録させない。
[project.plugins.tags]
enabled = true
tags = true
listings = true
listings_toc = false
tags_allowed = ["千手氏","系統","中世","近世","筑前千手氏","豊前香春千手氏","日向高鍋千手氏","肥前小城千手氏","嘉麻・夜須","香春・金田","高鍋","小城"]
